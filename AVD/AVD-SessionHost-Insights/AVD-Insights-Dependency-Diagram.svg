<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AVD Session Host Insights Dependency Diagram</title>
  <desc id="desc">Layered dependency flow for DCR setup, precheck validation, alert deployment, and email delivery. Connectors are routed to avoid visual overlap.</desc>

  <defs>
    <marker id="arrowFoundation" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f78d1" />
    </marker>
    <marker id="arrowValidation" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6f42c1" />
    </marker>
    <marker id="arrowDeployment" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f9d55" />
    </marker>
    <marker id="arrowRuntime" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d9822b" />
    </marker>
    <style>
      .bg { fill: #f7fafe; }
      .lane { fill: #ecf3ff; stroke: #d4e1f7; stroke-width: 1; }
      .title { font: 700 24px Segoe UI, Arial, sans-serif; fill: #1f2d3d; }
      .subtitle { font: 12px Segoe UI, Arial, sans-serif; fill: #4c5d6f; }
      .laneTitle { font: 700 14px Segoe UI, Arial, sans-serif; fill: #2b3d4f; }
      .nodeScript { fill: #e7f3ff; stroke: #1f78d1; stroke-width: 1.6; rx: 8; }
      .nodeResource { fill: #e9f9ef; stroke: #23864f; stroke-width: 1.6; rx: 8; }
      .nodeOutput { fill: #fff3e4; stroke: #c46a17; stroke-width: 1.6; rx: 8; }
      .nodeText { font: 600 13px Segoe UI, Arial, sans-serif; fill: #1f2d3d; }
      .link { cursor: pointer; }
      .link:hover rect { stroke-width: 2.2; }
      .edgeFoundation { stroke: #1f78d1; stroke-width: 2.2; fill: none; marker-end: url(#arrowFoundation); }
      .edgeValidation { stroke: #6f42c1; stroke-width: 2.2; fill: none; marker-end: url(#arrowValidation); }
      .edgeDeployment { stroke: #1f9d55; stroke-width: 2.2; fill: none; marker-end: url(#arrowDeployment); }
      .edgeDeploymentDashed { stroke: #1f9d55; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowDeployment); }
      .edgeRuntime { stroke: #d9822b; stroke-width: 2.2; fill: none; marker-end: url(#arrowRuntime); }
      .label { font: 12px Segoe UI, Arial, sans-serif; fill: #41566b; }
      .legend { fill: #ffffff; stroke: #d4e1f7; stroke-width: 1; }
      .legendText { font: 12px Segoe UI, Arial, sans-serif; fill: #2b3d4f; }
    </style>
  </defs>

