name: VMSKURetirementReport CI

# The tool is supported on Windows only (Azure CLI and local PowerShell, as a GitHub Copilot skill or a standalone script),
# so CI and release run on Windows only.

on:
  push:
    branches: [main]
    paths:
      - Assessments/VMSKURetirementReport/**
      - .github/workflows/vm-sku-retirement-report-ci.yml
  pull_request:
    paths:
      - Assessments/VMSKURetirementReport/**
      - .github/workflows/vm-sku-retirement-report-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-sku-retirement-report-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable | Format-Table -AutoSize

      - name: Bootstrap, lint, version check, tests
        shell: pwsh
        working-directory: Assessments/VMSKURetirementReport
        run: ./build.ps1 -Task Bootstrap, Lint, Version, Test -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results
          path: Assessments/VMSKURetirementReport/TestResults/pester.xml
          if-no-files-found: ignore

  sample-diff:
    name: Committed sample is current (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds the sample offline (mock Azure CLI, cached evidence, fixed date) in a scratch folder and compares every file with
      # examples/sample-report; the generation time and line endings are ignored. It fails when a code or data change was
      # committed without regenerating the sample (./build.ps1 -Task Sample).
      - name: Rebuild the sample and compare it with the committed one
        shell: pwsh
        working-directory: Assessments/VMSKURetirementReport
        run: ./build.ps1 -Task SampleDiff

  browser-smoke:
    name: HTML report in Edge (Windows, informational)
    runs-on: windows-latest
    # The checks drive a real browser that the runner image updates on its own schedule, so a failure here is shown but does
    # not fail the workflow. Remove this line to make the job required.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install playwright-core (the library only; Edge is already on the runner)
        shell: pwsh
        working-directory: Assessments/VMSKURetirementReport/tools
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.64.0

      - name: Open the sample report in Edge and check the collapsible VM details
        shell: pwsh
        working-directory: Assessments/VMSKURetirementReport/tools
        run: node browser-smoke.js ../examples/sample-report msedge

  powershell-compat:
    name: PowerShell ${{ matrix.version }} runtime check (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The supported floor (the last 7.2 release) and the latest 7.4 release; the main job above runs the runner's own,
          # newer PowerShell. To move a version, update it here together with the SHA-256 from the release's hashes.sha256.
          - version: '7.2.24'
            sha256: 'a1ccb6d8ad52f917470a136c3752af4465f261bcbe570cf44f52aa69ae6e867e'
          - version: '7.4.21'
            sha256: 'b47ee814b9fe5fe6b713a26667998cadd6bbb74cb3889fadea56c775f11953a2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PowerShell ${{ matrix.version }} (official archive, checksum verified)
        shell: pwsh
        env:
          PWSH_VERSION: ${{ matrix.version }}
          PWSH_SHA256: ${{ matrix.sha256 }}
        run: |
          $name = "PowerShell-$env:PWSH_VERSION-win-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$env:PWSH_VERSION/$name" -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PWSH_SHA256) { throw "$name failed checksum verification: expected $env:PWSH_SHA256, got $actual." }
          $dest = Join-Path $env:RUNNER_TEMP "pwsh-$env:PWSH_VERSION"
          Expand-Archive -LiteralPath $zip -DestinationPath $dest
          "PWSH_EXE=$(Join-Path $dest 'pwsh.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the offline mock assessment under PowerShell ${{ matrix.version }}
        shell: pwsh
        env:
          EXPECTED_PWSH_VERSION: ${{ matrix.version }}
        run: |
          $smoke = @'
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.ToString() -ne $env:EXPECTED_PWSH_VERSION) { throw "Expected PowerShell $env:EXPECTED_PWSH_VERSION but is running $($PSVersionTable.PSVersion)." }
          $root = Join-Path $env:GITHUB_WORKSPACE 'Assessments/VMSKURetirementReport/skills/vm-sku-retirement-report'
          $out = Join-Path $env:RUNNER_TEMP 'pwsh-smoke-output'
          $env:PATH = (Join-Path $root 'tests/mock') + [IO.Path]::PathSeparator + $env:PATH
          & (Join-Path $root 'scripts/Invoke-VMSKURetirementReport.ps1') -OutputPath $out -OfflineCatalog -AsOfDate '2026-09-24' -ThrottleLimit 2 -SkipPricing
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Assessment failed with exit code $LASTEXITCODE" }
          $report = Get-Content (Join-Path $out 'assessment.json') -Raw | ConvertFrom-Json
          if ($report.summary.TotalVmsScanned -ne 7) { throw "Unexpected VM count: $($report.summary.TotalVmsScanned)" }
          '@
          $file = Join-Path $env:RUNNER_TEMP 'pwsh-smoke.ps1'
          Set-Content -LiteralPath $file -Value $smoke
          & $env:PWSH_EXE -NoProfile -File $file
          if ($LASTEXITCODE -ne 0) { throw "The assessment failed under PowerShell $env:EXPECTED_PWSH_VERSION (exit code $LASTEXITCODE)." }

  package:
    name: Package skill
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package
        shell: pwsh
        working-directory: Assessments/VMSKURetirementReport
        run: ./build.ps1 -Task Package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-package
          path: |
            Assessments/VMSKURetirementReport/dist/*.zip
            Assessments/VMSKURetirementReport/dist/*.zip.sha256
