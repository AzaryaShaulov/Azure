name: VMSKURetirementReport Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches tool version
        shell: pwsh
        working-directory: Assessments/VMSKURetirementReport
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Import-Module ./skills/vm-sku-retirement-report/scripts/modules/Common.psm1 -Force -DisableNameChecking
          $v = Get-ToolVersion
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match tool version v$v" }

      - name: Lint, test, package
        shell: pwsh
        working-directory: Assessments/VMSKURetirementReport
        run: ./build.ps1 -Task Bootstrap, Lint, Version, Test, Package -CI

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            Assessments/VMSKURetirementReport/dist/*.zip
            Assessments/VMSKURetirementReport/dist/*.zip.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: Assessments/VMSKURetirementReport/dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        working-directory: Assessments/VMSKURetirementReport
        run: |
          $ver = $env:TAG.TrimStart('v')
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## \[$([regex]::Escape($ver))\].*?(?=^## \[|\z)").Value
          if (-not $section) { $section = 'See CHANGELOG.md' }
          Set-Content -Path release-notes.md -Value $section
          $zip = "dist/VMSKURetirementReport-$($env:TAG).zip"
          gh release create $env:TAG $zip "$zip.sha256" --title $env:TAG --notes-file release-notes.md --verify-tag
