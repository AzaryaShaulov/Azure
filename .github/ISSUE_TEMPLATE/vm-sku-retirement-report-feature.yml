name: VMSKURetirementReport feature request
description: Project moved; request features in AzaryaShaulov/VMSKURetirementReport.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Project moved:** this repository contains only a retired historical snapshot.
        Request features at https://github.com/AzaryaShaulov/VMSKURetirementReport/issues.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: evidence
    attributes:
      label: Supporting Microsoft documentation
      description: New retirement data or rules must be backed by an official Microsoft source.
